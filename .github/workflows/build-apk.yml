name: Build APK

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
    # The badges list is read by the app at runtime, and the bot and the branding are not in the
    # app: editing them needs no new APK
    paths-ignore:
      - "glassgram-api/**"
      - "glassgram-bot/**"
      - "branding/**"
  pull_request:
    paths-ignore:
      - "glassgram-api/**"
      - "glassgram-bot/**"
      - "branding/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза (например v1.0.0). Пусто — без релиза"
        type: string
        default: ""
      variant:
        description: "Что собирать"
        type: choice
        default: release
        options:
          - release
          - debug
          - standalone
          - huawei

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_CMAKE_VERSION: 3.22.1
  ANDROID_BUILD_TOOLS_VERSION: 36.0.0
  ANDROID_PLATFORM: android-36

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages, NDK and CMake
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nasm ninja-build
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "platform-tools" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      # Chaquopy (plugins) installs the bundled Python packages with a build Python of the
      # same version as the app's
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Gradle task
        id: task
        run: |
          VARIANT="${{ github.event.inputs.variant || 'release' }}"
          case "$VARIANT" in
            release)    TASK=":TMessagesProj_App:assembleAfatRelease";               OUT="TMessagesProj_App/build/outputs/apk" ;;
            debug)      TASK=":TMessagesProj_App:assembleAfatDebug";                 OUT="TMessagesProj_App/build/outputs/apk" ;;
            standalone) TASK=":TMessagesProj_AppStandalone:assembleAfatStandalone";  OUT="TMessagesProj_AppStandalone/build/outputs/apk" ;;
            huawei)     TASK=":TMessagesProj_AppHuawei:assembleAfatRelease";         OUT="TMessagesProj_AppHuawei/build/outputs/apk" ;;
            *) echo "Unknown variant: $VARIANT"; exit 1 ;;
          esac
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      # Own signing key from the repository secrets; without them the public key from the
      # Telegram sources (TMessagesProj/config/release.keystore) is used
      - name: Use the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set, signing with the public Telegram key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > TMessagesProj/config/release.keystore
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          keytool -list -keystore TMessagesProj/config/release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Signing with the key from the repository secrets"

      - name: Build APK
        env:
          # Telegram API credentials of this fork, from the repository secrets
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          chmod +x gradlew
          # A release knows its own version from its tag, which the app's update check compares
          VERSION_ARG=""
          if [ -n "$RELEASE_TAG" ]; then
            VERSION_ARG="-PGLASSGRAM_VERSION_NAME=${RELEASE_TAG#v}"
          fi
          ./gradlew ${{ steps.task.outputs.task }} $VERSION_ARG \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=4

      # Releases: glassgram-v<version>.apk; other builds: glassgram-<variant>-<commit>.apk
      - name: Rename APK
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          mkdir -p dist
          if [ -n "$RELEASE_TAG" ]; then
            base="glassgram-v${RELEASE_TAG#v}"
          else
            base="glassgram-${{ steps.task.outputs.variant }}-${GITHUB_SHA::7}"
          fi
          count=$(find "${{ steps.task.outputs.out }}" -name '*.apk' | wc -l)
          find "${{ steps.task.outputs.out }}" -name '*.apk' | while read -r apk; do
            flavor_dir="$(basename "$(dirname "$apk")")"
            if [ "$count" -gt 1 ]; then
              cp "$apk" "dist/${base}-${flavor_dir}.apk"
            else
              cp "$apk" "dist/${base}.apk"
            fi
          done
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-${{ steps.task.outputs.variant }}-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      # Artifacts are temporary; every master build is also published as the
      # "latest" pre-release, so the newest APK always has a stable download link.
      - name: Publish APK as the "latest" pre-release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Glassgram (latest master build)" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"

      # A pushed tag, or a manual run with release_tag (which creates the tag on this commit)
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Glassgram ${{ github.event.inputs.release_tag || github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
